<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>João · Portfólio PS2</title>
  <meta name="description" content="Portfólio de João — desenvolvedor. Projetos, sobre e contato, com a estética do menu do PlayStation 2." />
  <meta name="theme-color" content="#020814" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #020814;
      --bg-2: #061a3a;
      --blue: #1e5bff;
      --glow: #7fb4ff;
      --glow-soft: rgba(127, 180, 255, 0.35);
      --text: #dfe9ff;
      --muted: #8ea6d4;
      --panel: rgba(10, 30, 70, 0.45);
      --panel-border: rgba(127, 180, 255, 0.22);
      --cross: #7fb4ff;
      --circle: #ff6b7a;
      --font: "Exo 2", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    :focus-visible { outline: 2px solid var(--glow); outline-offset: 4px; }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    .screen {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      transition: opacity 0.5s ease;
    }

    .screen[hidden] { display: none; }
    .is-fading { opacity: 0; pointer-events: none; }

    /* ---------- Mute ---------- */
    #mute {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(10, 30, 70, 0.55);
      border: 1px solid var(--panel-border);
      color: var(--glow);
    }
    #mute svg { width: 20px; height: 20px; }
    #mute .off { display: none; }
    #mute[aria-pressed="true"] .on { display: none; }
    #mute[aria-pressed="true"] .off { display: block; }

    /* ---------- Boot ---------- */
    #boot { pointer-events: auto; cursor: pointer; }
    .boot-text {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      padding: 0 16px;
      opacity: 0;
      pointer-events: none;
    }
    .boot-company {
      top: 50%;
      transform: translateY(-50%);
      font-weight: 300;
      font-size: clamp(0.85rem, 2.6vw, 1.25rem);
      letter-spacing: 0.45em;
      color: #cfe0ff;
    }
    .boot-logo {
      bottom: 14%;
      font-weight: 700;
      font-size: clamp(1.8rem, 7vw, 3.6rem);
      letter-spacing: 0.12em;
      color: #fff;
      text-shadow: 0 0 24px rgba(127, 180, 255, 0.8), 0 0 60px rgba(30, 91, 255, 0.6);
    }
    .boot-logo small {
      display: block;
      font-size: 0.32em;
      font-weight: 300;
      letter-spacing: 0.6em;
      color: var(--glow);
      margin-top: 6px;
    }
    #boot.run .boot-company { animation: bootCompany var(--d) ease forwards; }
    #boot.run .boot-logo { animation: bootLogo var(--d) ease forwards; }
    @keyframes bootCompany {
      0% { opacity: 0; letter-spacing: 0.8em; }
      12% { opacity: 1; }
      40% { opacity: 1; letter-spacing: 0.45em; }
      52%, 100% { opacity: 0; }
    }
    @keyframes bootLogo {
      0%, 55% { opacity: 0; filter: blur(8px); }
      78%, 100% { opacity: 1; filter: blur(0); }
    }
    .boot-skip {
      position: absolute;
      bottom: 16px;
      left: 16px;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: rgba(142, 166, 212, 0.6);
      text-transform: uppercase;
    }

    /* ---------- App shell ---------- */
    #app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100%;
      place-items: stretch;
    }
    #app[hidden] { display: none; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 20px clamp(16px, 4vw, 48px) 0;
    }
    .brand {
      font-weight: 600;
      letter-spacing: 0.25em;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--muted);
    }
    .brand strong { color: var(--text); font-weight: 700; }
    .clock {
      text-align: right;
      font-weight: 300;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    .clock .time { font-size: 1.4rem; color: var(--text); }
    .clock .date { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.1em; }

    .views {
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    .view {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px clamp(16px, 4vw, 48px) 24px;
      opacity: 0;
      transform: scale(1.03);
      visibility: hidden;
      transition: opacity 0.35s ease, transform 0.35s ease, visibility 0s linear 0.35s;
    }
    .view.active {
      opacity: 1;
      transform: none;
      visibility: visible;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .view-title {
      margin: 8px 0 24px;
      font-weight: 300;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      letter-spacing: 0.08em;
      color: #fff;
      text-shadow: 0 0 20px var(--glow-soft);
    }
    .view-title span { color: var(--muted); font-size: 0.55em; letter-spacing: 0.3em; display: block; text-transform: uppercase; }

    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 24px;
      padding: 12px 72px 20px clamp(16px, 4vw, 48px);
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .controls button { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
    .controls button:hover { color: var(--text); }
    .sym {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .sym.x { color: var(--cross); }
    .sym.o { color: var(--circle); }
    #ctl-back[hidden] { display: none; }

    /* ---------- Main menu ---------- */
    #view-menu { display: grid; align-content: center; }
    #view-menu.active { display: grid; }
    .menu {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: clamp(18px, 4vh, 36px);
      justify-content: center;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 8px 16px;
      text-align: left;
      font-size: clamp(1.6rem, 6vw, 3rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      color: rgba(223, 233, 255, 0.45);
      transition: color 0.25s, text-shadow 0.25s, transform 0.25s;
    }
    .menu-item small {
      display: block;
      font-size: 0.32em;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .orb {
      flex: none;
      width: 0.7em;
      height: 0.7em;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0%, #9cc4ff 25%, #1e5bff 65%, #061a3a 100%);
      opacity: 0.35;
      transform: scale(0.75);
      transition: opacity 0.25s, transform 0.25s, box-shadow 0.25s;
    }
    .menu-item:focus { outline: none; }
    .menu-item.sel, .menu-item:hover {
      color: #fff;
      text-shadow: 0 0 18px rgba(127, 180, 255, 0.9), 0 0 40px rgba(30, 91, 255, 0.6);
      transform: translateX(8px);
    }
    .menu-item.sel small, .menu-item:hover small { opacity: 1; }
    .menu-item.sel .orb, .menu-item:hover .orb {
      opacity: 1;
      transform: scale(1);
      box-shadow: 0 0 24px rgba(127, 180, 255, 0.9);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 50% { box-shadow: 0 0 40px rgba(127, 180, 255, 1); } }

    /* ---------- Projects (memory card browser) ---------- */
    .browser {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: clamp(16px, 3vw, 40px);
      align-items: start;
    }
    .slots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 16px;
    }
    .slot {
      display: grid;
      justify-items: center;
      gap: 12px;
      padding: 18px 8px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: background 0.2s, border-color 0.2s;
      perspective: 400px;
    }
    .slot:focus { outline: none; }
    .slot.sel, .slot:hover {
      background: rgba(30, 91, 255, 0.14);
      border-color: var(--panel-border);
    }
    .slot-name {
      font-size: 0.85rem;
      text-align: center;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .slot.sel .slot-name { color: #fff; }

    .cube {
      --s: 54px;
      --h: 210;
      width: var(--s);
      height: var(--s);
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-22deg) rotateY(35deg);
      animation: spin 9s linear infinite;
      animation-play-state: paused;
    }
    .slot.sel .cube, .slot:hover .cube { animation-play-state: running; }
    .cube i {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-style: normal;
      font-weight: 700;
      font-size: 1.3rem;
      color: rgba(255, 255, 255, 0.9);
      background: hsla(var(--h), 90%, 55%, 0.22);
      border: 1px solid hsla(var(--h), 100%, 80%, 0.6);
      box-shadow: inset 0 0 18px hsla(var(--h), 100%, 70%, 0.35);
    }
    .cube i:nth-child(1) { transform: translateZ(calc(var(--s) / 2)); }
    .cube i:nth-child(2) { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
    .cube i:nth-child(3) { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
    .cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
    .cube i:nth-child(5) { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
    .cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
    @keyframes spin {
      from { transform: rotateX(-22deg) rotateY(35deg); }
      to { transform: rotateX(-22deg) rotateY(395deg); }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: clamp(16px, 3vw, 28px);
      backdrop-filter: blur(6px);
    }
    .detail { position: sticky; top: 0; }
    .detail h3 { margin: 0 0 4px; font-size: 1.4rem; font-weight: 600; color: #fff; }
    .detail .meta { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; }
    .detail p { line-height: 1.65; color: #c7d6f5; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; padding: 0; list-style: none; }
    .tags li {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      color: var(--glow);
    }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      background: rgba(30, 91, 255, 0.25);
      border: 1px solid var(--panel-border);
      transition: background 0.2s, box-shadow 0.2s;
    }
    .btn.soon { opacity: 0.55; cursor: default; }
    .btn:hover, .btn:focus-visible { background: rgba(30, 91, 255, 0.5); box-shadow: 0 0 18px var(--glow-soft); }

    /* ---------- About (system configuration) ---------- */
    .config { display: grid; gap: 20px; max-width: 860px; }
    .config-rows { list-style: none; margin: 0; padding: 0; }
    .config-rows li {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(127, 180, 255, 0.12);
    }
    .config-rows li:last-child { border-bottom: 0; }
    .config-rows span { color: var(--muted); }
    .config-rows strong { font-weight: 400; text-align: right; }
    .bio { line-height: 1.7; color: #c7d6f5; margin: 0; }
    .skills { display: grid; gap: 14px; }
    .skill-head { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; }
    .skill-head span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
    .bar { height: 8px; border-radius: 4px; background: rgba(127, 180, 255, 0.12); overflow: hidden; }
    .bar > div {
      height: 100%;
      width: 0;
      border-radius: 4px;
      background: linear-gradient(90deg, #1e5bff, #7fb4ff);
      box-shadow: 0 0 12px rgba(127, 180, 255, 0.7);
      transition: width 0.9s cubic-bezier(.2, .8, .2, 1);
    }
    .panel h4 {
      margin: 0 0 14px;
      font-weight: 400;
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ---------- Contact ---------- */
    .contact-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; max-width: 640px; }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-radius: 10px;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background 0.2s, border-color 0.2s, text-shadow 0.2s;
    }
    .contact-item:focus { outline: none; }
    .contact-item.sel, .contact-item:hover {
      background: rgba(30, 91, 255, 0.16);
      border-color: var(--panel-border);
      text-shadow: 0 0 14px var(--glow-soft);
    }
    .contact-item .orb { font-size: 1.6rem; }
    .contact-item.sel .orb, .contact-item:hover .orb { opacity: 1; transform: scale(1); box-shadow: 0 0 18px rgba(127, 180, 255, 0.9); }
    .contact-item b { display: block; font-weight: 600; font-size: 1.1rem; }
    .contact-item span { color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; }

    /* ---------- Responsive ---------- */
    @media (max-width: 760px) {
      .browser { grid-template-columns: 1fr; }
      .detail { position: static; }
      .slots { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
      .cube { --s: 44px; }
      .controls { justify-content: flex-start; padding-right: 72px; }
      .clock .time { font-size: 1.1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      #boot.run .boot-company { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <button id="mute" type="button" aria-pressed="false" aria-label="Silenciar som">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
  </button>

  <!-- Boot -->
  <section id="boot" class="screen" hidden aria-label="Animação de abertura (clique para pular)">
    <div class="boot-text boot-company" id="boot-company"></div>
    <div class="boot-text boot-logo" id="boot-logo"></div>
    <div class="boot-skip">clique para pular</div>
  </section>

  <!-- Site -->
  <div id="app" class="screen" hidden>
    <header class="topbar">
      <div class="brand" id="brand"></div>
      <div class="clock" aria-live="off">
        <div class="time" id="clock-time">--:--</div>
        <div class="date" id="clock-date"></div>
      </div>
    </header>

    <main class="views">
      <section id="view-menu" class="view" aria-label="Menu principal">
        <ul class="menu" data-list>
          <li><button class="menu-item" data-go="projects"><span class="orb"></span><span>Projetos<small>Memory Card · saves</small></span></button></li>
          <li><button class="menu-item" data-go="about"><span class="orb"></span><span>Sobre<small>System Configuration</small></span></button></li>
          <li><button class="menu-item" data-go="contact"><span class="orb"></span><span>Contato<small>Network Adaptor</small></span></button></li>
        </ul>
      </section>

      <section id="view-projects" class="view" aria-labelledby="t-projects">
        <h2 class="view-title" id="t-projects"><span>Memory Card (8MB) · Slot 1</span>Projetos</h2>
        <div class="browser">
          <div class="slots" id="slots" role="list"></div>
          <article class="panel detail" id="detail" aria-live="polite"></article>
        </div>
      </section>

      <section id="view-about" class="view" aria-labelledby="t-about">
        <h2 class="view-title" id="t-about"><span>System Configuration</span>Sobre</h2>
        <div class="config">
          <div class="panel"><p class="bio" id="bio"></p></div>
          <div class="panel"><h4>Informações do sistema</h4><ul class="config-rows" id="config-rows"></ul></div>
          <div class="panel"><h4>Habilidades</h4><div class="skills" id="skills"></div></div>
        </div>
      </section>

      <section id="view-contact" class="view" aria-labelledby="t-contact">
        <h2 class="view-title" id="t-contact"><span>Network Configuration</span>Contato</h2>
        <ul class="contact-list" id="contacts" data-list></ul>
      </section>
    </main>

    <nav class="controls" aria-label="Controles">
      <button type="button" id="ctl-enter"><span class="sym x">✕</span> Entrar</button>
      <button type="button" id="ctl-back" hidden><span class="sym o">◯</span> Voltar</button>
    </nav>
  </div>

  <script>
    /* =========================================================
       EDITE AQUI: todo o conteúdo do portfólio fica neste objeto.
       ========================================================= */
    const PORTFOLIO = {

        },
        {

          links: { codigo: "https://github.com/jvfsouza" },

        },
        {
          titulo: "Projeto Delta",

        },
        {
          titulo: "Este site",
          ano: "2026",
          descricao: "Portfólio inspirado no boot e no menu do PlayStation 2: canvas, CSS 3D e som sintetizado com Web Audio.",

          links: { codigo: "https://github.com/jvfsouza/site" },
          cor: 200,
        },
        {
          titulo: "Portfólio PS3",
          ano: "2026",
          descricao: "A versão deste portfólio inspirada no menu do PlayStation 3: a onda que muda de cor com o mês e os projetos no lugar dos jogos.",
          tecnologias: ["Canvas", "CSS", "Web Audio"],
          links: { demo: "index.html", codigo: "https://github.com/jvfsouza/site" },
          cor: 275,
        },
      ],
      contatos: [
        { rotulo: "E-mail", valor: "seuemail@exemplo.com", url: "mailto:seuemail@exemplo.com" },

        { rotulo: "LinkedIn", valor: "linkedin.com/in/seu-perfil", url: "https://www.linkedin.com/" },

    };

    /* ========================================================= */

    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const BOOT_MS = reduceMotion ? 1000 : 3000;
    const store = {
      get(k, s = localStorage) { try { return s.getItem(k); } catch { return null; } },
      set(k, v, s = localStorage) { try { s.setItem(k, v); } catch {} },
    };
    const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    /* ---------------- Áudio ---------------- */
    const audio = {
      ctx: null,
      master: null,
      muted: store.get("ps2-muted") === "1",
      file: null,
      init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.7;
        this.master.connect(this.ctx.destination);
      },
      setMuted(m) {
        this.muted = m;
        store.set("ps2-muted", m ? "1" : "0");
        if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.7, this.ctx.currentTime, 0.05);
        if (this.file) this.file.muted = m;
      },
      reverb() {
        const c = this.ctx, len = c.sampleRate * 2.6;
        const buf = c.createBuffer(2, len, c.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = buf.getChannelData(ch);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
        }
        const conv = c.createConvolver();
        conv.buffer = buf;
        return conv;
      },
      // Recriação sintetizada do clima do boot (~3s): drone grave + whoosh + acorde etéreo.
      bootSynth() {
        if (!this.ctx) return;
        const c = this.ctx, t0 = c.currentTime + 0.02;
        const out = c.createGain();
        out.gain.value = 0.9;
        const rev = this.reverb();
        const wet = c.createGain();
        wet.gain.value = 0.55;
        out.connect(this.master);
        out.connect(rev); rev.connect(wet); wet.connect(this.master);

        // Drone grave que cresce
        [[36.71, "sine", 0.5], [73.42, "sawtooth", 0.08], [55, "sine", 0.25]].forEach(([f, type, v]) => {
          const o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
          o.type = type; o.frequency.value = f;
          o.frequency.linearRampToValueAtTime(f * 1.02, t0 + 1.4);
          lp.type = "lowpass"; lp.frequency.setValueAtTime(200, t0); lp.frequency.linearRampToValueAtTime(900, t0 + 1.3);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(v, t0 + 1.25);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.2);
          o.connect(lp); lp.connect(g); g.connect(out);
          o.start(t0); o.stop(t0 + 3.3);
        });

        // Whoosh de ruído subindo
        const nLen = c.sampleRate * 1.6, nb = c.createBuffer(1, nLen, c.sampleRate), nd = nb.getChannelData(0);
        for (let i = 0; i < nLen; i++) nd[i] = Math.random() * 2 - 1;
        const ns = c.createBufferSource(), bp = c.createBiquadFilter(), ng = c.createGain();
        ns.buffer = nb;
        bp.type = "bandpass"; bp.Q.value = 1.4;
        bp.frequency.setValueAtTime(180, t0 + 0.2);
        bp.frequency.exponentialRampToValueAtTime(4200, t0 + 1.45);
        ng.gain.setValueAtTime(0.0001, t0 + 0.2);
        ng.gain.exponentialRampToValueAtTime(0.18, t0 + 1.3);
        ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);
        ns.connect(bp); bp.connect(ng); ng.connect(out);
        ns.start(t0 + 0.2);

        // Acorde etéreo (Ré maior com 9ª) a partir de ~1.45s
        const tc = t0 + 1.45;
        [146.83, 293.66, 440, 587.33, 659.25, 739.99, 880, 1174.66].forEach((f, i) => {
          [-4, 4].forEach((det) => {
            const o = c.createOscillator(), g = c.createGain();
            o.type = i < 2 ? "triangle" : "sine";
            o.frequency.value = f; o.detune.value = det;
            const v = (i < 2 ? 0.07 : 0.045) / (1 + i * 0.12);
            g.gain.setValueAtTime(0.0001, tc);
            g.gain.exponentialRampToValueAtTime(v, tc + 0.06 + i * 0.015);
            g.gain.exponentialRampToValueAtTime(0.0001, tc + 2.4);
            o.connect(g); g.connect(out);
            o.start(tc); o.stop(tc + 2.5);
          });
        });

        // Brilhos agudos
        [0, 0.12, 0.22, 0.38, 0.5].forEach((d, i) => {
          const o = c.createOscillator(), g = c.createGain(), t = tc + d;
          o.type = "sine"; o.frequency.value = [2349.3, 2959.96, 3520, 2637, 4698.6][i];
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.025, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
          o.connect(g); g.connect(out);
          o.start(t); o.stop(t + 0.8);
        });
      },
      // Tenta usar assets/boot.mp3 (se existir); senão, usa o sintetizado.
      playBoot() {
        return new Promise((resolve) => {
          let done = false;
          const fallback = () => { if (done) return; done = true; this.file = null; this.bootSynth(); resolve(); };
          try {
            const el = new Audio();
            el.preload = "auto";
            el.muted = this.muted;
            el.addEventListener("canplay", () => {
              if (done) return;
              el.play().then(() => { done = true; this.file = el; resolve(); }).catch(fallback);
            }, { once: true });
            el.addEventListener("error", fallback, { once: true });
            el.src = "assets/boot.mp3";
            setTimeout(fallback, 600);
          } catch { fallback(); }
        });
      },
      blip(kind = "move") {
        if (!this.ctx || this.muted) return;
        const c = this.ctx, t = c.currentTime;
        const seq = { move: [[1046.5, 0]], ok: [[880, 0], [1318.5, 0.06]], back: [[784, 0], [523.25, 0.06]] }[kind];
        seq.forEach(([f, d]) => {
          const o = c.createOscillator(), g = c.createGain();
          o.type = "sine"; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t + d);
          g.gain.exponentialRampToValueAtTime(0.08, t + d + 0.008);
          g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.14);
          o.connect(g); g.connect(this.master);
          o.start(t + d); o.stop(t + d + 0.16);
        });
      },
    };

    const muteBtn = $("#mute");
    const syncMute = () => {
      muteBtn.setAttribute("aria-pressed", String(audio.muted));
      muteBtn.setAttribute("aria-label", audio.muted ? "Ativar som" : "Silenciar som");
    };
    syncMute();
    muteBtn.addEventListener("click", (e) => { e.stopPropagation(); audio.setMuted(!audio.muted); syncMute(); });

    /* ---------------- Canvas de efeitos ---------------- */
    const cv = $("#fx"), g = cv.getContext("2d");
    let W = 0, H = 0, DPR = 1;
    function resize() {
      DPR = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * DPR; cv.height = H * DPR;
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    addEventListener("resize", resize);
    resize();

    const particles = Array.from({ length: reduceMotion ? 0 : 110 }, () => ({
      x: Math.random(), y: Math.random(), z: Math.random(),
      vx: (Math.random() - 0.5) * 0.02, vy: -0.01 - Math.random() * 0.03,
      tw: Math.random() * Math.PI * 2,
    }));

    function drawParticles(dt, alpha) {
      g.globalCompositeOperation = "lighter";
      for (const p of particles) {
        p.x += p.vx * dt; p.y += p.vy * dt; p.tw += dt * 2;
        if (p.y < -0.05) { p.y = 1.05; p.x = Math.random(); }
        if (p.x < -0.05) p.x = 1.05; else if (p.x > 1.05) p.x = -0.05;
        const r = 0.6 + p.z * 2.2;
        const a = alpha * (0.25 + 0.5 * p.z) * (0.6 + 0.4 * Math.sin(p.tw));
        const px = p.x * W, py = p.y * H;
        const grd = g.createRadialGradient(px, py, 0, px, py, r * 4);
        grd.addColorStop(0, `rgba(190,220,255,${a})`);
        grd.addColorStop(1, "rgba(60,120,255,0)");
        g.fillStyle = grd;
        g.beginPath(); g.arc(px, py, r * 4, 0, Math.PI * 2); g.fill();
      }
      g.globalCompositeOperation = "source-over";
    }

    // Torres de cubos translúcidos (o momento clássico do boot)
    const towers = [];
    for (let i = -4; i <= 4; i++) for (let j = -4; j <= 4; j++) {
      if (Math.random() < 0.35) continue;
      const dist = Math.hypot(i, j);
      towers.push({ x: i * 1.7, z: j * 1.7, h: 1 + Math.floor(Math.random() * Math.max(1, 7 - dist)), delay: dist * 0.07 + Math.random() * 0.15 });
    }

    function makeProj(theta, R, camY) {
      const ct = Math.cos(theta), st = Math.sin(theta);
      const p = Math.atan2(camY - 1.2, R), cp = Math.cos(p), sp = Math.sin(p);
      const f = Math.min(W, H) * 1.1, cx = W / 2, cy = H * 0.45;
      return (x, y, z) => {
        const X = x * ct - z * st;
        let Z = x * st + z * ct + R;
        const Y = y - camY;
        const Y2 = Y * cp + Z * sp, Z2 = -Y * sp + Z * cp;
        if (Z2 < 0.2) return null;
        return [cx + (f * X) / Z2, cy - (f * Y2) / Z2, Z2];
      };
    }

    function drawTowers(t, alpha) {
      const ease = (k) => 1 - Math.pow(1 - Math.min(Math.max(k, 0), 1), 3);
      const proj = makeProj(0.7 + t * 0.3, 24 - t * 1.6, 9 - t * 0.6);
      g.globalCompositeOperation = "lighter";
      g.lineWidth = 1;
      const s = 0.5;
      for (const tw of towers) {
        const grow = ease((t - 0.6 - tw.delay) / 1.1);
        if (grow <= 0) continue;
        const h = tw.h * grow;
        const levels = Math.ceil(h);
        for (let k = 0; k < levels; k++) {
          const y0 = k, y1 = Math.min(k + 1, h) - 0.06;
          if (y1 <= y0) continue;
          const c = [
            [tw.x - s, y0, tw.z - s], [tw.x + s, y0, tw.z - s], [tw.x + s, y0, tw.z + s], [tw.x - s, y0, tw.z + s],
            [tw.x - s, y1, tw.z - s], [tw.x + s, y1, tw.z - s], [tw.x + s, y1, tw.z + s], [tw.x - s, y1, tw.z + s],
          ].map((v) => proj(...v));
          if (c.some((v) => !v)) continue;
          const fog = Math.max(0.15, 1 - (c[0][2] - 8) / 22);
          const top = k === levels - 1 ? 1.6 : 1;
          g.fillStyle = `rgba(40,100,255,${0.05 * alpha * fog * top})`;
          g.strokeStyle = `rgba(130,185,255,${0.32 * alpha * fog})`;
          [[0, 1, 5, 4], [1, 2, 6, 5], [2, 3, 7, 6], [3, 0, 4, 7], [4, 5, 6, 7]].forEach((face) => {
            g.beginPath();
            face.forEach((idx, n) => (n ? g.lineTo(c[idx][0], c[idx][1]) : g.moveTo(c[idx][0], c[idx][1])));
            g.closePath(); g.fill(); g.stroke();
          });
        }
      }
      g.globalCompositeOperation = "source-over";
    }

    let scene = "black", sceneStart = performance.now(), last = performance.now();
    function setScene(s) { scene = s; sceneStart = performance.now(); }

    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      const t = (now - sceneStart) / 1000;
      g.clearRect(0, 0, W, H);

      if (scene === "boot") {
        const k = Math.min(t / (BOOT_MS / 1000), 1);
        // Escuro → névoa azul
        const bg = g.createRadialGradient(W / 2, H * 0.55, 0, W / 2, H * 0.55, Math.max(W, H) * 0.8);
        bg.addColorStop(0, `rgba(20,60,170,${0.15 + k * 0.45})`);
        bg.addColorStop(1, "rgba(0,0,0,1)");
        g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
        g.fillStyle = bg; g.fillRect(0, 0, W, H);
        // Brilho central do começo
        const flare = Math.max(0, 1 - Math.abs(t - 0.5) / 0.6);
        if (flare > 0) {
          const fl = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.min(W, H) * 0.5);
          fl.addColorStop(0, `rgba(160,200,255,${0.35 * flare})`);
          fl.addColorStop(1, "rgba(30,90,255,0)");
          g.fillStyle = fl; g.fillRect(0, 0, W, H);
        }
        if (!reduceMotion) drawTowers(t, 1);
        drawParticles(dt * 3, 0.9);
      } else if (scene === "menu") {
        const fade = Math.min(t / 0.8, 1);
        const bg = g.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, "#020814"); bg.addColorStop(0.6, "#061a3a"); bg.addColorStop(1, "#0a2a5c");
        g.fillStyle = bg; g.fillRect(0, 0, W, H);
        // Névoa / luzes se movendo devagar
        g.globalCompositeOperation = "lighter";
        const tt = reduceMotion ? 0 : now / 1000;
        [[0.25, 0.7, 0.55, 0.11], [0.75, 0.35, 0.45, 0.07], [0.5, 1.0, 0.8, 0.08]].forEach(([x, y, r, a], i) => {
          const px = W * (x + Math.sin(tt * 0.12 + i * 2) * 0.08), py = H * (y + Math.cos(tt * 0.1 + i) * 0.05);
          const rad = Math.max(W, H) * r;
          const gr = g.createRadialGradient(px, py, 0, px, py, rad);
          gr.addColorStop(0, `rgba(40,110,255,${a * fade})`);
          gr.addColorStop(1, "rgba(40,110,255,0)");
          g.fillStyle = gr; g.fillRect(0, 0, W, H);
        });
        g.globalCompositeOperation = "source-over";
        drawParticles(dt, 0.55 * fade);
      } else {
        g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    /* ---------------- Conteúdo ---------------- */
    function render() {
      const P = PORTFOLIO;
      $("#brand").innerHTML = `<strong>${esc(P.nome)}</strong> · ${esc(P.cargo)}`;
      $("#boot-company").textContent = "PORTFOLIO ENTERTAINMENT";
      $("#boot-logo").innerHTML = `${esc(P.nome.toUpperCase())}<small>${esc(P.cargo.toUpperCase())}</small>`;

      $("#slots").innerHTML = P.projetos.map((p, i) => {
        const letter = esc(p.titulo.trim()[0] || "?");
        return `<button class="slot" role="listitem" data-i="${i}" aria-label="${esc(p.titulo)}">
          <div class="cube" style="--h:${Number(p.cor) || 210}"><i>${letter}</i><i>${letter}</i><i>${letter}</i><i>${letter}</i><i></i><i></i></div>
          <div class="slot-name">${esc(p.titulo)}</div>
        </button>`;
      }).join("");

      $("#bio").textContent = P.bio;
      $("#config-rows").innerHTML = P.info.map(([k, v]) => `<li><span>${esc(k)}</span><strong>${esc(v)}</strong></li>`).join("");
      $("#skills").innerHTML = P.habilidades.map(([n, v]) => `
        <div><div class="skill-head"><span>${esc(n)}</span><span>${Number(v)}%</span></div>
        <div class="bar" role="progressbar" aria-label="${esc(n)}" aria-valuenow="${Number(v)}" aria-valuemin="0" aria-valuemax="100"><div data-w="${Number(v)}"></div></div></div>`).join("");

      $("#contacts").innerHTML = P.contatos.map((c) => `
        <li><a class="contact-item" href="${esc(c.url)}" ${c.url.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>
          <span class="orb"></span><span><b>${esc(c.rotulo)}</b><span>${esc(c.valor)}</span></span></a></li>`).join("");
    }

    function showProject(i) {
      const p = PORTFOLIO.projetos[i];
      if (!p) return;
      const L = p.links || {};
      // Links externos abrem em nova aba; páginas deste site (ex.: index.html) abrem na mesma
      const ext = (u) => (/^https?:/.test(u) ? ' target="_blank" rel="noopener"' : "");
      const has = (u) => u && u !== "#";   // "#" = link ainda não definido
      const links = [
        has(L.demo) ? `<a class="btn" href="${esc(L.demo)}"${ext(L.demo)}>▶ Ver demo</a>` : L.demo ? `<span class="btn soon">▶ Demo em breve</span>` : "",
        has(L.codigo) ? `<a class="btn" href="${esc(L.codigo)}"${ext(L.codigo)}>⌘ Código</a>` : "",
      ].join("");
      $("#detail").innerHTML = `
        <div class="meta">Slot ${String(i + 1).padStart(2, "0")} · ${esc(p.ano || "")}</div>
        <h3>${esc(p.titulo)}</h3>
        <p>${esc(p.descricao)}</p>
        <ul class="tags">${(p.tecnologias || []).map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
        <div class="links">${links}</div>`;
    }

    /* ---------------- Navegação ---------------- */
    let current = "menu";
    const lastFocus = {};

    function navItems(view) {
      const v = $(`#view-${view}`);
      if (view === "projects") return $$(".slot", v);
      return $$(".menu-item, .contact-item", v);
    }

    function select(el, sound = true) {
      if (!el) return;
      const items = navItems(current);
      items.forEach((x) => x.classList.toggle("sel", x === el));
      lastFocus[current] = items.indexOf(el);
      if (document.activeElement !== el) el.focus({ preventScroll: false });
      if (current === "projects") showProject(Number(el.dataset.i));
      if (sound) audio.blip("move");
    }

    function go(view, sound = true) {
      if (!$(`#view-${view}`)) return;
      if (sound) audio.blip(view === "menu" ? "back" : "ok");
      $$(".view").forEach((v) => v.classList.toggle("active", v.id === `view-${view}`));
      current = view;
      $("#ctl-back").hidden = view === "menu";
      if (view === "about") {
        $$("#skills .bar > div").forEach((b) => (b.style.width = "0"));
        requestAnimationFrame(() => requestAnimationFrame(() => $$("#skills .bar > div").forEach((b) => (b.style.width = b.dataset.w + "%"))));
      }
      const items = navItems(view);
      if (items.length) {
        select(items[lastFocus[view] || 0], false);
      } else {
        const title = $(`#view-${view} .view-title`);
        title.setAttribute("tabindex", "-1");
        title.focus();
      }
      if (history.replaceState) history.replaceState(null, "", view === "menu" ? location.pathname : `#${view}`);
    }

    function back() { if (current !== "menu") go("menu"); }

    function move(dir) {
      const items = navItems(current);
      if (!items.length) return;
      let i = items.indexOf(document.activeElement);
      if (i < 0) i = lastFocus[current] || 0;
      if (current === "projects") {
        const top = items[0].offsetTop;
        const cols = Math.max(1, items.filter((x) => x.offsetTop === top).length);
        const step = { left: -1, right: 1, up: -cols, down: cols }[dir];
        const n = i + step;
        if (n >= 0 && n < items.length) select(items[n]);
      } else {
        const step = dir === "up" || dir === "left" ? -1 : 1;
        select(items[(i + step + items.length) % items.length]);
      }
    }

    function wireApp() {
      $$("[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));
      $("#ctl-back").addEventListener("click", back);
      $("#ctl-enter").addEventListener("click", () => {
        const el = navItems(current)[lastFocus[current] || 0];
        if (el) el.click();
      });
      $$(".menu-item, .contact-item, .slot").forEach((el) => {
        el.addEventListener("mouseenter", () => { if (!el.classList.contains("sel")) select(el); });
        el.addEventListener("focus", () => { if (!el.classList.contains("sel")) select(el, false); });
      });
      $$(".slot").forEach((el) => el.addEventListener("click", () => {
        audio.blip("ok");
        $("#detail a")?.focus();
      }));
      $$(".contact-item").forEach((el) => el.addEventListener("click", () => audio.blip("ok")));

      addEventListener("keydown", (e) => {
        if ($("#app").hidden) return;
        const k = e.key;
        const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
        if (map[k]) {
          // Dentro do painel de detalhes, as setas voltam para a grade
          e.preventDefault();
          move(map[k]);
        } else if (k === "Escape" || k === "Backspace") {
          e.preventDefault();
          back();
        }
      });

      // Roda do mouse: troca a seleção (em "Sobre" a página rola normalmente)
      let wheelLock = 0;
      addEventListener("wheel", (e) => {
        if ($("#app").hidden || current === "about") return;
        e.preventDefault();
        const now = performance.now();
        if (now < wheelLock) return;
        const d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        if (Math.abs(d) < 8) return;
        wheelLock = now + 140;
        // Nos projetos anda um slot por vez; nas listas, para cima/baixo
        if (current === "projects") move(d > 0 ? "right" : "left");
        else move(d > 0 ? "down" : "up");
      }, { passive: false });
    }

    /* ---------------- Relógio ---------------- */
    function tick() {
      const d = new Date();
      $("#clock-time").textContent = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      $("#clock-date").textContent = d.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short" }).toUpperCase();
    }

    /* ---------------- Fluxo: start → boot → menu ---------------- */
    function showApp() {
      setScene("menu");
      const app = $("#app");
      app.hidden = false;
      app.classList.add("is-fading");
      requestAnimationFrame(() => app.classList.remove("is-fading"));
      const initial = location.hash.slice(1);
      go(["projects", "about", "contact"].includes(initial) ? initial : "menu", false);
    }

    let booting = false;
    async function startBoot() {
      if (booting) return;
      booting = true;
      audio.init();
      if (audio.ctx && audio.ctx.state === "suspended") {
        // Sem interação o navegador costuma recusar; espera no máximo 150ms pela resposta.
        await Promise.race([audio.ctx.resume().catch(() => {}), new Promise((r) => setTimeout(r, 150))]);
      }
      // Só toca o som do boot se o áudio foi liberado; senão ele tocaria atrasado no primeiro clique.
      if (audio.ctx && audio.ctx.state === "running") await audio.playBoot();

      const boot = $("#boot");
      boot.hidden = false;
      boot.style.setProperty("--d", BOOT_MS + "ms");
      boot.classList.add("run");
      setScene("boot");

      let ended = false;
      const end = () => {
        if (ended) return;
        ended = true;
        store.set("ps2-booted", "1", sessionStorage);
        boot.classList.add("is-fading");
        setTimeout(() => { boot.hidden = true; showApp(); }, 450);
        removeEventListener("keydown", skipKey);
      };
      const skipKey = (e) => { if (["Enter", " ", "Escape"].includes(e.key)) { e.preventDefault(); end(); } };
      boot.addEventListener("click", end, { once: true });
      addEventListener("keydown", skipKey);
      setTimeout(end, BOOT_MS);
    }

    addEventListener("hashchange", () => {
      if ($("#app").hidden) return;
      const v = location.hash.slice(1);
      go(["projects", "about", "contact"].includes(v) ? v : "menu", false);
    });

    render();
    wireApp();
    tick();
    setInterval(tick, 15000);

    // Sem tela de "PRESS START": o boot começa sozinho. O navegador pode bloquear
    // o som até o primeiro clique/tecla; a partir daí os sons de navegação funcionam.
    const unlock = () => {
      audio.init();
      if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume();
      removeEventListener("pointerdown", unlock, true);
      removeEventListener("keydown", unlock, true);
    };
    addEventListener("pointerdown", unlock, true);
    addEventListener("keydown", unlock, true);

    if (store.get("ps2-booted", sessionStorage) === "1") showApp();
    else startBoot();
  </script>
</body>
</html>
