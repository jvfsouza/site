<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>João Victor · Portfólio</title>
  <meta name="description" content="portifólio inspirado no ps3" />
  <meta name="theme-color" content="#1a1030" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/ps3.css" />
</head>
<body>
  <canvas id="wave" aria-hidden="true"></canvas>

  <button id="mute" type="button" aria-pressed="false" aria-label="Silenciar som">
    <span class="vol on" aria-hidden="true"></span>
    <span class="vol off" aria-hidden="true"></span>
  </button>

  <div id="intro" hidden aria-label="Abertura (clique para pular)">
    <div id="boot-logo"><span class="name" id="boot-name"></span><span class="sub">portfólio</span></div>
    <div class="skip">clique para pular</div>
  </div>

  <div id="xmb" hidden>
    <div class="clock" aria-hidden="true">
      <span class="date" id="clock-date"></span><span class="sep"></span><span class="time" id="clock-time"></span>
    </div>
    <nav id="cats" aria-label="Categorias"></nav>
    <div id="lists"></div>
    <div class="hint">← → categorias · ↑ ↓ itens · Enter abrir</div>
  </div>

  <aside id="panel" aria-live="polite" aria-hidden="true"></aside>

  <div class="controls" id="controls" hidden>
    <button type="button" id="ctl-back"><span class="sym o">◯</span> Voltar</button>
  </div>

  <script src="assets/data/portfolio.js"></script>
  <script src="assets/js/ps3.js"></script>
</body>
</html>
